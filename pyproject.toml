[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HaemoLynx"
version = "0.1.0"
description = "Vascular network analysis from 3D microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Finbar Argus", email = "finbar.argus@auckland.ac.nz" },
    { name = "Harvey Davis" },
]
keywords = [
    "vascular",
    "microvasculature",
    "haemodynamics",
    "microscopy",
    "skeletonization",
    "graph",
    "network-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: napari",
]
# Lower bounds are the oldest release the test suite passes on, not the oldest
# that imports. See tests/test_packaging_metadata.py, which reads them back.
dependencies = [
    "numpy>=1.23",
    "tifffile>=2022.8.12",
    "matplotlib>=3.6",
    "networkx>=2.8",
    "scikit-image>=0.24",
    "scipy>=1.9",
    "pandas>=2.0.2",
    "plotly>=5.10",
    "h5py>=3.7",
    "skan>=0.11.1",
    "pyvista>=0.45",
    "pyyaml>=6.0",
]

[project.urls]
# The repository is private today, so these 404 for anyone else, and it has not
# moved to the physiomelinks organisation yet. Issue #109 tracks both.
Homepage = "https://github.com/FinbarArgus/HaemoLynx"
Repository = "https://github.com/FinbarArgus/HaemoLynx"
Issues = "https://github.com/FinbarArgus/HaemoLynx/issues"

[project.optional-dependencies]
# pytest-qt is deliberately NOT here: it is a pytest plugin that aborts the
# whole run with "pytest-qt requires either PySide6, PyQt5 or PyQt6 installed"
# when there is no Qt binding, rather than skipping. The napari-gui CI job
# installs it alongside the napari extra, which brings a binding with it.
dev = ["pytest", "nbconvert", "nbformat", "npe2>=0.8; python_version >= '3.10'"]
notebook = ["ipykernel"]
# The napari panel. napari 0.8 requires Python 3.11, above this library's 3.9,
# so this extra is installable only there -- deliberately, rather than
# resolving to an old napari that has not been tested against.
#
# It includes a Qt binding, because `pip install "HaemoLynx[napari]"` should
# give a panel that opens: napari itself declares none, and without one it
# exits with "No Qt bindings found". Use the `napari-plugin` extra instead to
# take the binding from an existing napari installation.
napari = ["napari[pyqt6]>=0.8", "magicgui>=0.7", "npe2>=0.8"]
napari-plugin = ["napari>=0.8", "magicgui>=0.7", "npe2>=0.8"]

[project.entry-points."napari.manifest"]
haemolynx = "haemolynx.gui:napari.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "slow: marks tests as slow",
    "plotting: marks tests that create figures",
    "integration: marks integration tests",
    "gui: marks tests that build real Qt widgets (need napari and a display)",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["haemolynx*"]

[tool.setuptools.package-data]
haemolynx = ["py.typed"]
"haemolynx.gui" = ["napari.yaml"]
