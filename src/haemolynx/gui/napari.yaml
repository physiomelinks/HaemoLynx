name: HaemoLynx
display_name: HaemoLynx
contributions:
  commands:
    - id: HaemoLynx.settings_widget
      title: Configure and run a pipeline
      python_name: haemolynx.gui._widget:settings_widget
  widgets:
    # One widget, so napari renders it as "Pipeline settings (HaemoLynx)" --
    # there is no way to suppress that suffix, see napari's
    # menu_item_template. It grouped the two under a submenu when there was a
    # second widget; a config is opened with "Load config..." in the panel
    # rather than run blind from a file, so there is only this one.
    - command: HaemoLynx.settings_widget
      display_name: Pipeline settings
