name: Tests

# Pull requests, pushes to the shared branches, and a weekly run: a regression
# merged around the PR check, or a dependency release that breaks the suite on
# a branch nobody has touched, is found within a week instead of by whoever
# next opens a PR.
on:
  pull_request:
  push:
    branches: [main, Devel_GUI_improvements_HD]
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC

# One run per branch or pull request at a time: a newer push cancels the run
# still going for an older commit, so only the newest commit is reported. The
# event is in the group, so a push to main never cancels the weekly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pyflakes errors and syntax errors only (`[tool.ruff.lint]` in
  # pyproject.toml): unused and undefined names, redefined functions. No
  # formatter runs; see RELEASE_REVIEW.md `code.6a`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff check
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Line coverage of src/haemolynx without gui/ (`[tool.coverage]` in
      # pyproject.toml), reported on one Python version. No threshold yet.
      - name: Run pytest
        if: matrix.python-version != '3.11'
        run: pytest

      - name: Run pytest with coverage
        if: matrix.python-version == '3.11'
        run: pytest --cov --cov-report=term:skip-covered --cov-report=xml

      - name: Coverage summary
        if: matrix.python-version == '3.11'
        run: echo "Line coverage (non-GUI) $(python -m coverage report --format=total)%" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Windows is where the panel is developed and run, and nothing else here
  # covers it: paths, SYSTEMROOT, process spawning, long-path limits. The
  # slow and GUI tests stay on the Linux jobs.
  windows:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: pytest -m "not slow and not gui" -n auto

  # The suite above runs against `src/` with the repository as the working
  # directory. This job answers a different question: does `pip install
  # HaemoLynx` give someone a package that works? It builds the wheel,
  # installs it into an empty environment with its declared dependencies
  # resolved from scratch, and runs it from a directory that is not the
  # repository -- so an import that only resolved because `src` was on the
  # path, or a module missing from the distribution, fails here.
  installed-package:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install it into an empty environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl

      - name: Run the package from outside the repository
        run: |
          mkdir -p /tmp/elsewhere
          cp tests/installed_package_smoke.py /tmp/elsewhere/
          cd /tmp/elsewhere
          /tmp/fresh/bin/python installed_package_smoke.py

      - name: Check the distribution's own tests
        run: |
          pip install -e .[dev]
          pytest tests/test_installed_package.py -v

  # The floors in pyproject.toml are a promise about the oldest releases this
  # works with. Running the suite against exactly those versions is the only
  # thing that keeps the promise true; without it a floor is a guess.
  dependency-floors:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-floor.txt -e ".[dev]"
          pip list

      - name: Run pytest
        run: pytest

  # The panel is Qt, and Qt mistakes only appear when a widget is really built:
  # options a LineEdit will not take, a value magicgui cannot parse back, a
  # scroll area that stretches the window. None of those fail without a
  # display, so this job provides one. napari needs Python 3.11.
  napari-gui:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      # Qt picks a backend from the environment; be explicit rather than lucky.
      QT_QPA_PLATFORM: xcb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the libraries Qt needs on a headless runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libdbus-1-3 xvfb

      - name: Install HaemoLynx with the napari extra
        run: |
          python -m pip install --upgrade pip
          # pytest-qt only here: it aborts a run that has no Qt binding, so it
          # must not reach the other jobs. The napari extra brings PyQt6.
          pip install -e ".[dev,napari]" pytest-qt

      - name: The plugin is discoverable
        run: python -m npe2 validate HaemoLynx

      - name: Build the panel and run it, under a virtual display
        run: xvfb-run -a pytest -m gui -v
