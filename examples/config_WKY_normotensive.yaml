# WKY (normotensive) pipeline configuration
# The frozen settings shared by all six specimens. Nothing here differs by group: the WKY and
# SHR files are identical apart from their first line, and exist only so a run can be
# launched by group name (open item 35).

SkeletonConfig:
  # Image analysis boundary
  sub_volume_percentage: 1.0 # 1.0 = Analyze full volume

HaemodynamicsConfig:
  # ------------------------------------------------------------------
  # Blood Flow Physics & Boundary Conditions
  # ------------------------------------------------------------------
  # Arteriolar inlet pressure (60 mmHg), the same for all six specimens
  # (cb_settings.INLET_PRESSURE_MMHG, open item 10)
  input_p_bc: 7.999343e6 # mPa
  # Venular outlet pressure (20 mmHg; cb_settings.OUTLET_PRESSURE_MMHG)
  output_p_bc: 2.666448e6 # mPa
  
  # ------------------------------------------------------------------
  # Baseline Radius Assignment
  # ------------------------------------------------------------------
  # The frozen estimator: the mask's Euclidean distance transform (reference §10.5).
  # Pericyte constriction is disabled for the CB pipeline (§10.6), so no keys for it here.
  radius_assignment_mode: "edt_radius"

  # ------------------------------------------------------------------
  # Non-Newtonian Rheology Solver (Fåhræus–Lindqvist effect)
  # ------------------------------------------------------------------
  blood_plasma_viscosity_cP: 1.2
  # cb_settings owns these four (open item 37)
  rheology_max_iterations: 1000
  rheology_relaxation: 0.2
  rheology_flow_rtol: 1.0e-6
  rheology_hematocrit_atol: 1.0e-4


PerfusionConfig:
  # ------------------------------------------------------------------
  # Master Physics Toggles
  # ------------------------------------------------------------------
  do_perfusion_modeling: true
  use_endothelial_barrier_model: true
  use_multi_species_model: true
  
  # 3D Tissue Grid Resolution (in micrometers)
  grid_resolution_xyz: [10.0, 10.0, 10.0] 
  
  # ------------------------------------------------------------------
  # Blood Gas Baselines
  # ------------------------------------------------------------------
  systemic_hematocrit: 0.45
  po2_arterial_mmHg: 100.0
  pco2_arterial: 40.0 # Normal physiological baseline, the same for both groups (open item 34)
  hco3_tissue: 24.0 # Standard bicarbonate buffer (mmol/L)
  
  # ------------------------------------------------------------------
  # Diffusion & Permeability (Endothelial Barriers)
  # ------------------------------------------------------------------
  # O2 Dynamics
  sigma_diff: 1.5e-9 # Tissue diffusion coefficient (m^2/s)
  permeability_o2_cm_s: 9.1e-2 # Capillary wall permeability (cm/s); Liu, Eskin & Hellums 1994, k / alpha_O2
  
  # CO2 Dynamics. D is close to O2's; CO2 moves ~20x faster through its solubility alone
  sigma_diff_co2: 1.6e-9 # Tissue diffusion coefficient (m^2/s), Kawashiro et al. 1975
  permeability_co2_cm_s: 9.1e-2 # Capillary wall permeability (cm/s), same as O2
  
  # ------------------------------------------------------------------
  # Tissue Metabolism (Michaelis-Menten Kinetics)
  # ------------------------------------------------------------------
  # Same as cb_settings.BASE_M_MAX, the rate behind the published H2 runs (open item 8)
  M_max: 0.05 # Maximum O2 consumption rate (mmol / L / s)
  k_reduce: 0.1 # Exponential decay constant under hypoxia
  respiratory_quotient: 0.82 # Ratio of CO2 produced to O2 consumed
  
  # ------------------------------------------------------------------
  # Non-Linear Picard Matrix Solver Parameters
  # ------------------------------------------------------------------
  picard_max_iterations: 200
  picard_tolerance: 1.0e-5 # = PerfusionConfig and cb_settings.PerfusionSettings (open items 6, 34)
