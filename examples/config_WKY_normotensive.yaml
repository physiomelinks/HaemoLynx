# WKY (Normotensive/Normoxic) Pipeline Configuration
# Simulates a healthy Carotid Body with normal blood pressure, minimal sympathetic tone, and sustainable metabolism.

SkeletonConfig:
  # Image analysis boundary
  sub_volume_percentage: 1.0 # 1.0 = Analyze full volume

HaemodynamicsConfig:
  # ------------------------------------------------------------------
  # Blood Flow Physics & Boundary Conditions
  # ------------------------------------------------------------------
  # Normal Mean Arterial Pressure (100 mmHg MAP)
  input_p_bc: 13.332e6 # mPa
  # Normal Central Venous Pressure (2 mmHg CVP)
  output_p_bc: 0.27e6 # mPa
  
  # ------------------------------------------------------------------
  # Pre-Capillary Sphincter Model (Sympathetic Tone)
  # ------------------------------------------------------------------
  constrict_at_pericytes: true
  constriction_mode: "sphincter"
  sphincter_length_um: 5.0
  # Healthy baseline: minimal sympathetic tone (vessels are 95% dilated)
  intimal_cushion_constriction_ratio: 0.95
  pre_capillary_constriction_ratio: 0.95
  pre_capillary_topological_offset: 1
  
  # ------------------------------------------------------------------
  # Automated 3D Diameter Extraction (FWHM Ray-Casting)
  # ------------------------------------------------------------------
  fwhm_sample_spacing_along_edge_um: 2.0
  fwhm_transverse_profile_step_um: 0.5
  fwhm_transverse_half_extent_um: 15.0
  
  # ------------------------------------------------------------------
  # Non-Newtonian Rheology Solver (Fåhræus–Lindqvist effect)
  # ------------------------------------------------------------------
  blood_plasma_viscosity_cP: 1.2
  rheology_max_iterations: 15
  rheology_tolerance: 1.0e-4


PerfusionConfig:
  # ------------------------------------------------------------------
  # Master Physics Toggles
  # ------------------------------------------------------------------
  do_perfusion_modeling: true
  use_endothelial_barrier_model: true
  use_multi_species_model: true
  
  # 3D Tissue Grid Resolution (in micrometers)
  grid_resolution_xyz: [10.0, 10.0, 10.0] 
  
  # ------------------------------------------------------------------
  # Blood Gas Baselines
  # ------------------------------------------------------------------
  systemic_hematocrit: 0.45
  po2_arterial_mmHg: 100.0
  pco2_arterial: 40.0 # Normal physiological baseline
  hco3_tissue: 24.0 # Standard bicarbonate buffer (mmol/L)
  
  # ------------------------------------------------------------------
  # Diffusion & Permeability (Endothelial Barriers)
  # ------------------------------------------------------------------
  # O2 Dynamics
  sigma_diff: 1.5e-9 # Tissue diffusion coefficient (m^2/s)
  permeability_o2_cm_s: 1.0e-4 # Capillary wall permeability (cm/s)
  
  # CO2 Dynamics (Diffuses ~20x faster than O2)
  sigma_diff_co2: 3.0e-8 # Tissue diffusion coefficient (m^2/s)
  permeability_co2_cm_s: 2.0e-3 # Capillary wall permeability (cm/s)
  
  # ------------------------------------------------------------------
  # Tissue Metabolism (Michaelis-Menten Kinetics)
  # ------------------------------------------------------------------
  # Reduced metabolic sink to simulate a sustainable, normoxic tissue equilibrium
  M_max: 0.005 # Maximum O2 consumption rate (mmol / L / s)
  k_reduce: 0.1 # Exponential decay constant under hypoxia
  respiratory_quotient: 0.82 # Ratio of CO2 produced to O2 consumed
  
  # ------------------------------------------------------------------
  # Non-Linear Picard Matrix Solver Parameters
  # ------------------------------------------------------------------
  picard_max_iterations: 50
  picard_tolerance: 1.0e-4