# Resistance network pipeline
# Settings for the end-to-end microvascular pipeline: optional ilastik segmentation, skeletonization, graph building, boundary and branch-order assignment, haemodynamics, and export.

# ------------------------------------------------------------------------
# Input and segmentation
# ------------------------------------------------------------------------
input_and_segmentation:
  # Read this already-segmented image as the pipeline input  [needs use_ilastik_segmentation off; must exist]
  input_path: examples/images/Nerve_capillaries.tif
  # Segment the main input image with ilastik instead of reading a segmented file
  use_ilastik_segmentation: false
  # Read this raw image as the ilastik input for main-image segmentation  [needs use_ilastik_segmentation; must exist]
  ilastik_unsegmented_image_path: images/Nerve_capillaries.tif
  # Use this trained ilastik project to segment the main image  [needs use_ilastik_segmentation; must exist]
  ilastik_classifier_path: classifiers/nerve_classifier.ilp
  # Run this ilastik executable name or path in headless mode
  ilastik_executable: ilastik.exe
  # Write ilastik-generated segmentations into this directory
  ilastik_output_dir: examples/outputs/segmentations
  # Give ilastik segmentation outputs this file suffix
  ilastik_output_suffix: .tif
  # Override the voxel size with these (x, y, z) values instead of reading image metadata  [um]
  voxel_size_override_xyz: null
  # Choose how the voxel size is resolved from metadata and the manual override  [one of: auto, override, metadata_only]
  voxel_size_policy: auto
  # Declare which array axis is which in the input files, so volumes can be transposed to canonical (z, y, x) on load  [one of: zyx, zxy, yzx, yxz, xzy, xyz]
  image_axis_order: zyx

# ------------------------------------------------------------------------
# Vessel masks
# ------------------------------------------------------------------------
vessel_masks:
  # Load large arteriole and venule masks for automated inlet/outlet node assignment
  use_large_vessel_masks: false
  # Produce the large-vessel masks with ilastik instead of reading pre-segmented files  [needs use_large_vessel_masks]
  use_ilastik_large_vessel_segmentation: false
  # Dilate the large-vessel masks by this distance before selecting terminal nodes  [um; range 0.0..; needs use_large_vessel_masks]
  large_vessel_mask_dilation_microns: 0.0
  # Remove connected components smaller than this physical volume from large-vessel masks after dilation (set 0 to disable)  [um3; range 0.0..; needs use_large_vessel_masks]
  large_vessel_min_component_volume_um3: 200.0
  # Remove tiny large-vessel components that sit attached near the opposite-type mask surface (suppresses small mislabelled attachments)  [needs use_large_vessel_masks]
  large_vessel_remove_small_opposite_attached_components: true
  # Maximum physical volume of a large-vessel component eligible for opposite-attached cleanup  [um3; range 0.0..; needs use_large_vessel_masks and large_vessel_remove_small_opposite_attached_components]
  large_vessel_opposite_attached_max_component_volume_um3: 250.0
  # Maximum distance from the opposite large-vessel mask for a tiny component to count as opposite-attached and be removed  [um; range 0.0..; needs use_large_vessel_masks and large_vessel_remove_small_opposite_attached_components]
  large_vessel_opposite_attached_max_distance_microns: 3.0
  # Before terminal assignment, remove arteriole/venule overlap voxels from the smaller overlapping connected component  [needs use_large_vessel_masks]
  exclude_smaller_overlapping_volumes: false
  # Read this pre-segmented large arteriole mask  [needs use_large_vessel_masks; must exist]
  large_arteriole_mask_path: images/large_arteriole_mask.tif
  # Read this pre-segmented large venule mask  [needs use_large_vessel_masks; must exist]
  large_venule_mask_path: images/large_venule_mask.tif
  # Read this raw image as the ilastik input for the large arteriole mask  [needs use_large_vessel_masks and use_ilastik_large_vessel_segmentation]
  ilastik_unsegmented_arteriole_image_path: images/large_arteriole_mask.tif
  # Read this raw image as the ilastik input for the large venule mask  [needs use_large_vessel_masks and use_ilastik_large_vessel_segmentation]
  ilastik_unsegmented_venule_image_path: images/large_venule_mask.tif
  # Use this trained ilastik project to segment arterioles  [needs use_large_vessel_masks and use_ilastik_large_vessel_segmentation; must exist]
  ilastik_arteriole_classifier_path: classifiers/arteriole_classifier.ilp
  # Use this trained ilastik project to segment venules  [needs use_large_vessel_masks and use_ilastik_large_vessel_segmentation; must exist]
  ilastik_venule_classifier_path: classifiers/venule_classifier.ilp
  # Assign arteriole and venule boundary nodes from small-vessel masks
  use_small_vessel_masks_for_boundary_assignment: false
  # Produce the small-vessel masks with ilastik instead of reading pre-segmented files  [needs use_small_vessel_masks_for_boundary_assignment]
  use_ilastik_small_vessel_segmentation: false
  # Require at least this fraction of an edge to lie inside a small-vessel mask before labelling it  [fraction; range 0.0..1.0; needs use_small_vessel_masks_for_boundary_assignment]
  small_vessel_mask_min_overlap_fraction: 0.5
  # Remove connected components smaller than this physical volume from small-vessel masks before boundary assignment (set 0 to disable)  [um3; range 0.0..; needs use_small_vessel_masks_for_boundary_assignment]
  small_vessel_min_component_volume_um3: 50.0
  # Write an interactive 3D HTML diagnostic of the small-vessel boundary labelling  [needs use_small_vessel_masks_for_boundary_assignment]
  write_small_vessel_boundary_labelling_3d_html: true
  # Read this pre-segmented small arteriole mask  [needs use_small_vessel_masks_for_boundary_assignment; must exist]
  small_arteriole_mask_path: images/small_arteriole_mask.tif
  # Read this pre-segmented small venule mask  [needs use_small_vessel_masks_for_boundary_assignment; must exist]
  small_venule_mask_path: images/small_venule_mask.tif
  # Read this raw image as the ilastik input for the small arteriole mask  [needs use_small_vessel_masks_for_boundary_assignment and use_ilastik_small_vessel_segmentation]
  ilastik_unsegmented_small_arteriole_image_path: images/small_arteriole_mask.tif
  # Read this raw image as the ilastik input for the small venule mask  [needs use_small_vessel_masks_for_boundary_assignment and use_ilastik_small_vessel_segmentation]
  ilastik_unsegmented_small_venule_image_path: images/small_venule_mask.tif
  # Use this trained ilastik project to segment small arterioles  [needs use_small_vessel_masks_for_boundary_assignment and use_ilastik_small_vessel_segmentation; must exist]
  ilastik_small_arteriole_classifier_path: classifiers/arteriole_classifier.ilp
  # Use this trained ilastik project to segment small venules  [needs use_small_vessel_masks_for_boundary_assignment and use_ilastik_small_vessel_segmentation; must exist]
  ilastik_small_venule_classifier_path: classifiers/venule_classifier.ilp

# ------------------------------------------------------------------------
# Boundary assignment
# ------------------------------------------------------------------------
boundary_assignment:
  # Write plot artifacts under this base directory
  base_plot_dir: examples/plots
  # Select inlet and outlet nodes automatically from the large-vessel masks instead of manually  [needs use_large_vessel_masks]
  automated_vessel_assignment: false
  # Choose how manual inlet nodes are picked from the graph  [one of: coordinates, all_degree_1, volume, edge_percent, degree_1_from_inlet]
  inlet_node_selection_method: coordinates
  # Choose how manual outlet nodes are picked from the graph  [one of: coordinates, all_degree_1, volume, edge_percent, degree_1_from_inlet]
  outlet_node_selection_method: volume
  # Choose how manual arteriole boundary nodes are picked from the graph  [one of: coordinates, all_degree_1, volume, edge_percent, degree_1_from_inlet]
  arteriole_boundary_selection_method: coordinates
  # Choose how manual venule boundary nodes are picked from the graph  [one of: coordinates, all_degree_1, volume, edge_percent, degree_1_from_inlet]
  venule_boundary_selection_method: coordinates
  # Split inlets from outlets along this array axis when the edge_percent method is used (0=z, 1=y, 2=x)  [range 0..2]
  boundary_axis: 1
  # Take inlets from the terminals in this much of the network, measured from its start along the boundary axis  [percent; range 0.0..100.0]
  boundary_first_percent: 10.0
  # Take outlets from the terminals in this much of the network, measured back from its end along the boundary axis  [percent; range 0.0..100.0]
  boundary_last_percent: 10.0
  # Keep only the terminals further than this from an inlet node when the degree_1_from_inlet method is used  [um; range 0.0..]
  boundary_distance_from_inlet_node: 0.0
  # Pick inlet nodes nearest to these (z, y, x) coordinates when the coordinates method is used  [um]
  inlet_node_coordinates:
  - - 308.4
    - 396.8
    - 615.1
  - - 324.6
    - 408.5
    - 636.1
  - - 267.8
    - 1520.8
    - 235.8
  - - 243.5
    - 387.5
    - 421.3
  - - 330.7
    - 389.8
    - 374.6
  # Pick outlet nodes nearest to these (z, y, x) coordinates when the coordinates method is used  [um]
  outlet_node_coordinates: []
  # Pick arteriole boundary nodes nearest to these (z, y, x) coordinates when the coordinates method is used  [um]
  arteriole_boundary_node_coordinates: []
  # Pick venule boundary nodes nearest to these (z, y, x) coordinates when the coordinates method is used  [um]
  venule_boundary_node_coordinates: []
  # Select inlet nodes falling inside these (min corner, max corner) boxes, each corner (z, y, x)  [um]
  inlet_node_volumes: []
  # Select outlet nodes falling inside these (min corner, max corner) boxes, each corner (z, y, x)  [um]
  outlet_node_volumes:
  - - - 0.0
      - 1308.0
      - 0.0
    - - 600.0
      - 1730.0
      - 700.0
  # Select arteriole boundary nodes falling inside these (min corner, max corner) boxes, each corner (z, y, x)  [um]
  arteriole_boundary_node_volumes: []
  # Select venule boundary nodes falling inside these (min corner, max corner) boxes, each corner (z, y, x)  [um]
  venule_boundary_node_volumes: []
  # Hold the inlet node IDs chosen during the run; leave empty to let the pipeline fill it
  inlet_nodes: []
  # Hold the outlet node IDs chosen during the run; leave empty to let the pipeline fill it
  outlet_nodes: []
  # Hold the arteriole boundary node IDs chosen during the run; leave empty to let the pipeline fill it
  arteriole_boundary_nodes: []
  # Hold the venule boundary node IDs chosen during the run; leave empty to let the pipeline fill it
  venule_boundary_nodes: []
  # Fail rather than fall back when the hierarchical branch-order prerequisites are not met
  strict_branch_order_assignment: false

# ------------------------------------------------------------------------
# Solver and output
# ------------------------------------------------------------------------
solver_and_output:
  # Apply this pressure boundary condition at the inlet nodes  [Pa; range 0.0..]
  inlet_p_bc: 4500.0
  # Apply this pressure boundary condition at the outlet nodes  [Pa; range 0.0..]
  outlet_p_bc: 1000.0
  # Generate the matplotlib visualizations at the end of the run
  visualize_results: false
  # Show plots interactively instead of saving them to the plot directory  [needs visualize_results]
  interactive_plots: false
  # Open saved plots in IDE windows while the run proceeds  [needs visualize_results]
  show_plots_in_ide: true
  # Choose which plots are shown in IDE windows  [one of: all, final_only, none; needs visualize_results and show_plots_in_ide]
  ide_plot_mode: final_only
  # Block at the end of the script so the IDE plot windows stay open  [needs visualize_results and show_plots_in_ide]
  hold_ide_plots_open: true
  # Render the final graph views as a 2D overlay or an interactive 3D plot  [one of: 2d, 3d; needs visualize_results]
  final_render_mode: 3d
  # Export vessels, pericytes and nodes as VTK files  [needs run_haemodynamics]
  vtk_export: true
  # Open the exported VTK network in the interactive viewer  [needs run_haemodynamics and vtk_export]
  visualize_vtk: false
  # Print verbose per-stage logging while the pipeline runs
  verbose_logging: false

# ------------------------------------------------------------------------
# Pipeline stages
# ------------------------------------------------------------------------
pipeline_stages:
  # Run the skeletonization stage instead of reusing the cached skeleton
  do_skeletonize: true
  # Run the graph-building stage instead of reusing the cached graph
  do_graph_building: true
  # Run the haemodynamics stage after the graph is built
  run_haemodynamics: true
  # Compute the two-point equivalent resistance between the chosen node pair  [needs run_haemodynamics]
  do_equiv_resistance_calculation: true
  # Prefix every VTK artifact and cached stage file with this output path
  vtk_output_prefix: examples/outputs/resistance_network
  # Close gaps in the mask with a structuring element of this radius before skeletonizing  [voxels; range 0..; needs do_skeletonize]
  skeleton_closing_radius: 2
  # Bridge skeleton gaps no larger than this many voxels  [voxels; range 0..; needs do_skeletonize]
  skeleton_bridge_gap_size: 3
  # Drop skeleton branches shorter than this many voxels during cleaning  [voxels; range 0..; needs do_skeletonize]
  skeleton_min_branch_length: 3
  # Reconnect skeleton fragments no further apart than this distance  [voxels; range 0..; needs do_skeletonize]
  skeleton_max_bridge_distance: 4
  # Use this voxel connectivity when analysing skeleton components  [range 1..3; needs do_skeletonize]
  skeleton_component_connectivity: 3
  # Reconnect graph fragments whose endpoints lie within this distance  [um; range 0.0..; needs do_graph_building]
  graph_reconnect_threshold: 10.0
  # Reconnect leftover orphan and dangling nodes within this distance in the final pass  [um; range 0.0..; needs do_graph_building]
  final_orphan_reconnect_threshold: 3.0
  # Prune terminal stubs shorter than this length  [um; range 0.0..; needs do_graph_building]
  min_stub_length: 10.0
  # Collapse clusters of nodes lying within this distance of each other  [um; range 0.0..; needs do_graph_building]
  cluster_collapse_distance: 5.0
  # Write a graph pickle and an overlay PNG after each graph-building step. Turn on to debug a bad topology; it dominates the runtime of a large run, so it is off by default  [needs do_graph_building]
  save_step_artifacts: false
  # Discard skeleton components smaller than this percentage of the total after cleanup  [percent; range 0.0..100.0; needs do_skeletonize]
  skeleton_min_component_percent: 10.0
  # Take the voxel staircase out of each vessel's centreline after the graph is built, and re-measure its length from the result  [needs do_graph_building]
  smooth_centrelines: true
  # How to smooth a centreline: taubin recovers true length, chaikin changes it least  [one of: taubin, chaikin; needs smooth_centrelines]
  centreline_smoothing_method: taubin
  # How many smoothing passes; accuracy plateaus around 15, and past that the filter slowly starts inflating a centreline instead  [range 0..50; needs smooth_centrelines]
  centreline_smoothing_iterations: 10
  # How far a smoothed centreline may sit from the skeleton before it is blended back towards the original  [um; range 0.0..; needs smooth_centrelines]
  centreline_max_deviation: 3.0

# ------------------------------------------------------------------------
# Statistics and measurements
# ------------------------------------------------------------------------
statistics_and_measurements:
  # Compute and export the global vessel statistics
  statistics: false
  # Measure 3D distances from the vessel network to a cell mask
  measurement_3d_to_cell_mask: false
  # Read this cell mask for the 3D distance measurement  [needs measurement_3d_to_cell_mask; must exist]
  cell_mask_path: null
  # Read this dataset from the cell mask when it is an H5 file  [needs measurement_3d_to_cell_mask]
  cell_mask_h5_dataset_name: null
  # Use this explicit vessel mask for the 3D distance measurement instead of the pipeline input  [needs measurement_3d_to_cell_mask; must exist]
  measurement_3d_vessel_mask_path: null
  # Read this dataset from the 3D-distance vessel mask when it is an H5 file  [needs measurement_3d_to_cell_mask]
  measurement_3d_vessel_mask_h5_dataset_name: null
  # Take the vessel-volume raster shape from this reference image  [needs measurement_3d_to_cell_mask; must exist]
  measurement_3d_reference_image_path: null
  # Read this dataset from the 3D-distance reference image when it is an H5 file  [needs measurement_3d_to_cell_mask]
  measurement_3d_reference_h5_dataset_name: null
  # Compute either the fast subset of vessel statistics or the full set  [one of: fast, full; needs statistics]
  statistics_mode: fast

# ------------------------------------------------------------------------
# Diameters and pericytes
# ------------------------------------------------------------------------
diameters_and_pericytes:
  # Which apparent-viscosity law sets the resistances: pries covers 3.3-1978 um in one expression and reads diameter_basis, capillary_power_law is the older law calibrated at 5 um with a placeholder constant above 7 um, constant is plasma everywhere. Resistances are not comparable across laws  [one of: pries, capillary_power_law, constant; needs run_haemodynamics]
  viscosity_law: capillary_power_law
  # What a vessel diameter in this dataset measures, which the pries law needs and no other reads: plasma_column for the channel the fluid occupies, as a plasma stain images it, or anatomical for a wall-to-wall diameter that includes the ~1.1 um endothelial surface layer. Choosing anatomical for a plasma-stained image subtracts that layer twice and roughly quintuples capillary resistance  [one of: plasma_column, anatomical; needs run_haemodynamics]
  diameter_basis: plasma_column
  # Discharge haematocrit the pries law is evaluated at; read by no other law  [fraction; range 0.0..0.99; needs run_haemodynamics]
  haematocrit: 0.45
  # Give every branch order the same vessel diameter instead of a per-order table
  all_diams_const: true
  # Legacy flag kept for older configs and CLI; ignored by baseline Haemodynamics and every perturbation merge (not shown as a typed-entry control). Focal constrictions come only from pericyte-typed perturbations via their strategy path  [needs run_haemodynamics]
  do_pericyte_construction: false
  # Axial length of each focal pericyte constriction/dilation site along the vessel centreline  [um; range 0.0..]
  constriction_length_um: 40.0
  # Centre-to-centre distance between regularly spaced pericyte sites when not placing from a mask  [um; range 0.0..]
  constriction_spacing_um: 100.0
  # Place focal constrictions/dilations at pericyte centroids from a mask instead of at regular spacing along vessels  [needs run_haemodynamics]
  use_pericyte_mask_constriction: false
  # Read pericyte centroids from this binary or labelled mask when mask-based placement is on; leave unset to keep the path from the Diameters tab  [needs use_pericyte_mask_constriction; must exist]
  pericyte_mask_path: null
  # H5 dataset name inside the pericyte mask file; ignored for TIFF masks  [needs use_pericyte_mask_constriction]
  pericyte_mask_h5_dataset_name: null
  # Assign a pericyte centroid to the nearest vessel edge only when they lie within this distance  [um; range 0.0..; needs use_pericyte_mask_constriction]
  pericyte_max_assignment_distance_um: 3.0
  # Ignore mask components smaller than this equivalent diameter as too small to be a pericyte  [um; range 0.0..; needs use_pericyte_mask_constriction]
  pericyte_min_diameter_um: 5.0
  # Ignore mask components larger than this equivalent diameter as too large to be a pericyte  [um; range 0.0..; needs use_pericyte_mask_constriction]
  pericyte_max_diameter_um: 12.0
  # Activate each candidate pericyte site at random rather than constricting/dilating every candidate  [needs run_haemodynamics]
  use_probabilistic_pericyte_constriction: false
  # Fraction of candidate pericyte sites that activate when probabilistic selection is on (0 = none, 1 = all)  [fraction; range 0.0..1.0; needs use_probabilistic_pericyte_constriction]
  pericyte_constriction_probability: 0.8
  # Draw the random pericyte cohort from this seed, so a run repeats; another seed constricts a different set of pericytes, and null draws a fresh cohort every run  [needs use_probabilistic_pericyte_constriction]
  pericyte_constriction_seed: 20240917
  # Legacy comparison-CSV flag; ignored by baseline assign_diameters and perturbation merges (CLI / library apply() only). Use Perturbations for pericyte tone  [needs run_haemodynamics]
  run_pericyte_resistance_comparison: false
  # Use this constriction factor as the baseline arm of the pericyte comparison  [range 0.0..; needs run_pericyte_resistance_comparison]
  pericyte_comparison_baseline_value: 1.0
  # Use this constriction factor as the constricted arm of the pericyte comparison  [range 0.0..; needs run_pericyte_resistance_comparison]
  pericyte_comparison_constricted_value: 0.8
  # Reuse the randomly selected pericyte cohort from the comparison in the main run  [needs run_pericyte_resistance_comparison and use_probabilistic_pericyte_constriction]
  reuse_comparison_pericyte_cohort_for_main_run: false
  # Build the diameter and constriction tables up to this branch-order index  [range 1..]
  max_branch_order: 51
  # Use this vessel diameter where no branch-order override applies  [um; range 0.0..]
  default_diameter: 4.0
  # Override capillary diameters per branch-order label, e.g. B01  [um]
  manual_capillary_diameter_by_branch_order:
    B01: 6.2
    B02: 4.0
    B03: 5.0
    B04: 5.0
  # Override arteriole diameters per branch-order label, e.g. Art1  [um]
  manual_arteriole_diameter_by_branch_order: {}
  # Override venule diameters per branch-order label, e.g. Ven1  [um]
  manual_venule_diameter_by_branch_order: {}
  # Supply the full branch-order diameter lookup; leave unset to derive it from the manual diameter settings  [um]
  diameter_by_branch_order: null
  # Global focal constriction/dilation factor for every branch order (1.0 = no local change; <1 narrows, >1 widens at pericyte sites). constriction_by_branch_order replaces this for listed orders only — empty map means this global factor alone  [range 0.0..; needs run_haemodynamics]
  pericyte_constriction_factor: 1.0
  # Sparse per-order overrides of pericyte_constriction_factor (<1 constricts, >1 dilates locally). Empty or unset makes no change (global factor only). A listed order replaces the global factor for that order alone (e.g. {B01: 1.0} with global 0.8 leaves B01 unchanged)
  constriction_by_branch_order: null
  # Apply the custom edge-diameter assignment behaviour to these edge IDs
  custom_edges: []

# ------------------------------------------------------------------------
# FWHM diameter measurement
# ------------------------------------------------------------------------
fwhm_diameter_measurement:
  # Measure per-edge diameters from the raw image by full-width-half-maximum fitting  [needs run_haemodynamics]
  use_fwhm_edge_diameters: false
  # Measure FWHM diameters from this raw single-channel image  [needs use_fwhm_edge_diameters; must exist]
  fwhm_raw_tiff_path: null
  # Sample a transverse profile every this far along the centerline  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_sample_spacing_along_edge_um: 2.0
  # Step this far between points when sampling each transverse profile  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_transverse_profile_step_um: 0.25
  # Sample this far either side of the centerline before any adaptive adjustment  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_transverse_half_extent_um: 6.0
  # Start the Gaussian fit from this diameter guess instead of an automatic one  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_diameter_guess_um: null
  # Require the sampled profile to span at least this multiple of the fitted width  [range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_min_total_extent_multiplier: 3.0
  # Mark background voxels with this label in the rasterized branch label volume  [needs use_fwhm_edge_diameters]
  fwhm_background_label: 0
  # Mark junction voxels with this label in the rasterized branch label volume  [needs use_fwhm_edge_diameters]
  fwhm_junction_label: -1
  # Let a transverse profile pass through junction voxels while sampling  [needs use_fwhm_edge_diameters]
  fwhm_allow_junction_crossing: false
  # Estimate the profile baseline from the profile wings or from a percentile  [one of: wings, percentile; needs use_fwhm_edge_diameters]
  fwhm_profile_baseline_mode: wings
  # Take this fraction of each profile end as the wing used for baseline estimation  [fraction; range 0.0..1.0; needs use_fwhm_edge_diameters]
  fwhm_profile_baseline_wing_fraction: 0.2
  # Hold the fitted baseline near the anchor estimate rather than letting it float  [needs use_fwhm_edge_diameters]
  fwhm_constrain_fitted_baseline: false
  # Allow the fitted baseline to move this fraction of the profile peak-to-peak range either way  [fraction; range 0.0..1.0; needs use_fwhm_edge_diameters and fwhm_constrain_fitted_baseline]
  fwhm_baseline_constraint_half_width_ptp: 0.35
  # Clip each profile to the central lobe so neighbouring branches do not bias the fit  [needs use_fwhm_edge_diameters]
  fwhm_clip_profile_to_single_vessel: true
  # Require the profile to fall by this fraction of the centre value before clipping starts  [fraction; range 0.0..1.0; needs use_fwhm_edge_diameters and fwhm_clip_profile_to_single_vessel]
  fwhm_clip_min_drop_fraction_of_center: 0.35
  # End the clipped lobe once the profile rises again by this fraction of the centre value  [fraction; range 0.0..1.0; needs use_fwhm_edge_diameters and fwhm_clip_profile_to_single_vessel]
  fwhm_clip_re_rise_fraction_of_center: 0.08
  # Skip sample positions within this distance of a branch endpoint  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_branch_endpoint_exclusion_um: 10.0
  # Skip sample positions within this distance of a detected junction voxel  [um; range 0.0..; needs use_fwhm_edge_diameters]
  fwhm_junction_proximity_exclusion_um: 10.0
  # Require profile samples to stay within a local arc window of the same edge  [needs use_fwhm_edge_diameters]
  fwhm_enforce_same_edge_locality: true
  # Use this absolute arc window when checking same-edge locality  [um; range 0.0..; needs use_fwhm_edge_diameters and fwhm_enforce_same_edge_locality]
  fwhm_same_edge_arc_window_um: 3.0
  # Scale the same-edge arc window by this factor  [range 0.0..; needs use_fwhm_edge_diameters and fwhm_enforce_same_edge_locality]
  fwhm_same_edge_arc_window_multiplier: 1.0
  # Never shrink the same-edge arc window below this size  [um; range 0.0..; needs use_fwhm_edge_diameters and fwhm_enforce_same_edge_locality]
  fwhm_same_edge_arc_window_min_um: 1.0
  # Shorten the profile half-extent when a distant part of the same edge comes close  [needs use_fwhm_edge_diameters]
  fwhm_cap_half_extent_by_nonlocal_same_edge_distance: true
  # Treat same-edge points separated by more than this arc length as nonlocal  [um; range 0.0..; needs use_fwhm_edge_diameters and fwhm_cap_half_extent_by_nonlocal_same_edge_distance]
  fwhm_nonlocal_same_edge_arc_separation_um: 6.0
  # Cap the profile half-extent at this fraction of the nearest nonlocal same-edge distance  [fraction; range 0.0..; needs use_fwhm_edge_diameters and fwhm_cap_half_extent_by_nonlocal_same_edge_distance]
  fwhm_nonlocal_same_edge_half_extent_factor: 0.45
  # Discard samples whose fitted centre drifts too far from the centerline position  [needs use_fwhm_edge_diameters]
  fwhm_reject_samples_with_center_offset: true
  # Discard a sample once its fitted centre is further than this from the expected centre  [um; range 0.0..; needs use_fwhm_edge_diameters and fwhm_reject_samples_with_center_offset]
  fwhm_max_fit_center_offset_um: 1.5
  # Discard samples whose transverse Gaussian fit quality is too low  [needs use_fwhm_edge_diameters]
  fwhm_reject_samples_with_low_fit_r2: true
  # Keep a sample only when its transverse Gaussian fit reaches this R-squared  [range 0.0..1.0; needs use_fwhm_edge_diameters and fwhm_reject_samples_with_low_fit_r2]
  fwhm_min_fit_r2: 0.85

# ------------------------------------------------------------------------
# Perturbation runs
# ------------------------------------------------------------------------
perturbation_runs:
  # Re-solve the finished network once per configured perturbation
  run_perturbations: false
  # Re-solve the network once for each of these, as a list of {name, type, overrides} entries; each runs from the same baseline rather than on top of the one before
  perturbations: []
  # Write each perturbation's CSVs here; leave unset for a 'perturbations' directory beside the other output  [needs run_perturbations]
  perturbation_output_dir: null
  # After the pipeline, sweep pericyte constriction/dilation against inlet pressure (whole-brain example script only; prefer a pericyte_dilation_sweep perturbation in the panel)
  run_pericyte_dilation_sweep: true
  # Start the pericyte constriction/dilation sweep at this percentage (negative = constriction, positive = dilation; scale = 1 + percent/100)  [percent; range -99..100]
  pericyte_dilation_min_percent: 1
  # End the pericyte constriction/dilation sweep at this percentage (negative = constriction, positive = dilation)  [percent; range -99..100]
  pericyte_dilation_max_percent: 30
  # Step size along the pericyte constriction/dilation percent axis (positive step; percent itself may be negative)  [percent; range 1..100]
  pericyte_dilation_step_percent: 1
  # Arteriole constriction/dilation: change every arteriole branch's diameter by this percentage (positive = dilation, negative = constriction; e.g. 10 widens by 10%, -20 narrows by 20%); whole-branch scaling, not a focal pericyte site  [percent; range -99.999..]
  arteriole_diameter_change_percent: 0.0
  # Start the arteriole constriction/dilation sweep at this percentage change (negative = constriction, positive = dilation; whole-branch scale = 1 + percent/100)  [percent; range -99..100]
  arteriole_dilation_min_percent: 0
  # End the arteriole constriction/dilation sweep at this percentage change (negative = constriction, positive = dilation)  [percent; range -99..100]
  arteriole_dilation_max_percent: 30
  # Step size along the arteriole constriction/dilation percent axis (positive step; percent itself may be negative)  [percent; range 1..100]
  arteriole_dilation_step_percent: 1
  # Start the passive capillary constriction/dilation sweep at this percentage change (whole capillary, not focal; negative = constriction, positive = dilation; scale = 1 + percent/100)  [percent; range -99..100]
  capillary_dilation_min_percent: 0
  # End the passive capillary constriction/dilation sweep at this percentage change (whole capillary, not focal; negative = constriction, positive = dilation)  [percent; range -99..100]
  capillary_dilation_max_percent: 30
  # Step size along the capillary constriction/dilation percent axis (positive step; percent itself may be negative)  [percent; range 1..100]
  capillary_dilation_step_percent: 1
  # Fixed whole-network constriction/dilation for a pericyte spacing or length sweep (scale = 1 + percent/100; negative = constriction, positive = dilation); pressure stays at inlet_p_bc  [percent; range -99..100]
  pericyte_geometry_dilation_percent: 0
  # Start the pericyte spacing sweep at this centre-to-centre inter-site distance  [um; range 0.0..]
  constriction_spacing_min_um: 50.0
  # End the pericyte spacing sweep at this centre-to-centre inter-site distance  [um; range 0.0..]
  constriction_spacing_max_um: 150.0
  # Step size along the pericyte spacing sweep (centre-to-centre distance between sites)  [um; range 0.0..]
  constriction_spacing_step_um: 50.0
  # Start the pericyte length sweep at this axial constriction/dilation site length  [um; range 0.0..]
  constriction_length_min_um: 20.0
  # End the pericyte length sweep at this axial constriction/dilation site length  [um; range 0.0..]
  constriction_length_max_um: 60.0
  # Step size along the pericyte length sweep (axial site length along the centreline)  [um; range 0.0..]
  constriction_length_step_um: 20.0
  # Start the inlet-pressure sweep at this absolute inlet boundary pressure  [Pa; range 0..]
  inlet_pressure_min_pa: 4500
  # End the inlet-pressure sweep at this absolute inlet boundary pressure  [Pa; range 0..]
  inlet_pressure_max_pa: 6000
  # Step size along the inlet-pressure sweep (absolute inlet boundary pressure)  [Pa; range 1..]
  inlet_pressure_step_pa: 500
  # Write the brain-script sweep CSV and curves here (a pericyte_dilation_sweep perturbation writes beside itself)
  sweep_output_dir: outputs/pericyte_dilation_sweep
